[package]
name = "odd-box"
description = "a dead simple reverse proxy server and web server"
version = "2.0.0-Preview"
edition = "2024"
authors = ["Olof Blomqvist <olof@twnet.se>"]
repository = "https://github.com/OlofBlomqvist/odd-box"
license-file = "LICENSE"

[dependencies]
anyhow = "1.0"
blocking = "1"
arc-swap = "1.7"
bollard = "0.18"
bytes = "1"
chrono = { version = "0.4", features= ["serde"] }
clap = { version="4.4", features=["derive"]}
cruma-tunnels-lib = { path = "/Users/olof/repos/uy/cruma-sdk/cruma-tunnels-lib"}
cruma-proxy-lib = { path = "/Users/olof/repos/uy/cruma-sdk/cruma-proxy-lib"}
cruma-proc-host = { path = "/Users/olof/repos/uy/cruma-sdk/cruma-proc-host" }
dashmap = "6.0"
http-body-util = "0.1"
lazy_static = "1.4"
notify = "6.1"
regex = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_pretty_yaml = "0.9.37"
self_update = { version = "0.42", default-features = false, features = ["rustls"] }
time = {version="0.3",features=["macros","formatting","parsing"]}
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version="0.3", features=[ "env-filter","std","fmt","time"] }
uuid = { version = "1.10", features = ["v4"] }
dirs = "5.0"
rustls = { version = "0.23", features = ["ring","std","tls12"], default-features = false}
ctrlc = "3.4"
image = "0.25"
iced = { version = "0.14", features = ["smol", "image", "lazy"] }
iced_selection = "0.5"
parking_lot = "0.12"
rfd = "0.14"
ratatui = "0.29"
crossterm = "0.28"
crossbeam-queue = "0.3"
flate2 = "1"

[patch.crates-io]
winit = { git = "https://github.com/rust-windowing/winit", branch = "master" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.3", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = ["Win32","Win32_Foundation","Win32_System","Win32_System_Console","Win32_NetworkManagement_IpHelper"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = 'z'     # Optimize for size
#lto = true          # Enable link-time optimization
#codegen-units = 1   # Reduce number of codegen units to increase optimizations
#panic = 'abort'     # Abort on panic
#strip = true        # Strip symbols from binary*
#debug = false
