[package]
name = "odd-box"
description = "a dead simple reverse proxy server and web server"
version = "2.0.0-Preview"
edition = "2024"
authors = ["Olof Blomqvist <olof@twnet.se>"]
repository = "https://github.com/OlofBlomqvist/odd-box"
license-file = "LICENSE"

[dependencies]
# The cruma agent library — provides all proxy, tunnel, process-hosting,
# TLS termination, ACME, GUI, TUI, and headless functionality.
cruma = { path = "cruma-sdk/cruma-tunnel-agent-bin" }

# Core
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
semver = "*"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
schemars = "1.1"

# Self-update
self_update = { version = "0.42", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
rfd = "0.15"

# TLS crypto provider (must be installed before any rustls usage)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Tracing (re-exported by cruma, but we use it directly in main)
tracing = "0.1"

[patch.crates-io]
h2 = { git = 'https://github.com/OlofBlomqvist/h2' }

[profile.release]
opt-level = 'z'

[package.metadata.bundle]
name = "Odd Box"
identifier = "se.twnet.oddbox"
icon = ["icons/icon.icns"]
short_description = "a dead simple reverse proxy server and web server"
copyright = "Copyright © Olof Blomqvist"
