[package]
name = "odd-box"
description = "a dead simple web/proxy server"
version = "2.0.0"
edition = "2024"
authors = ["Olof Blomqvist <olof@twnet.se>"]
repository = "https://github.com/OlofBlomqvist/odd-box"
license-file = "LICENSE"
build = "build.rs"

[dependencies]
# The cruma agent library — provides all proxy, tunnel, process-hosting,
# TLS termination, ACME, GUI, TUI, and headless functionality.
cruma = { path = "cruma-sdk/cruma-tunnel-agent-bin" , features = ["service-map", "ipv6-tunnel", "ai-assistant", "webview"]}
cruma-tunnels-lib = { path = "cruma-sdk/cruma-tunnels-lib", default-features = false, features = ["schema"] }

# Core
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
semver = "*"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
schemars = "1.1"

# Self-update
self_update = { version = "0.42", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
rfd = "0.15.4"

# TLS crypto provider (must be installed before any rustls usage)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Tracing (re-exported by cruma, but we use it directly in main)
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
h2 = { git = 'https://github.com/OlofBlomqvist/h2' }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 'z'
strip = true

[profile.dist]
inherits = "release"
debug = 0
lto = "fat"
codegen-units = 1
strip = "symbols"

[package.metadata.bundle]
name = "Odd Box"
identifier = "se.twnet.oddbox"
icon = ["icons/icon.icns"]
short_description = "a dead simple reverse proxy server and web server"
copyright = "Copyright © Olof Blomqvist"
