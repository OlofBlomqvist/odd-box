<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>503 Service Unavailable</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #0f1419;
                --fg: #e6edf3;
                --muted: #8b949e;
                --accent: #ff6c00;
                --info-bg: rgba(255, 108, 0, 0.08);
                --info-border: rgba(255, 108, 0, 0.2);
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f6f8fa;
                    --fg: #1f2328;
                    --muted: #57606a;
                    --info-bg: rgba(255, 108, 0, 0.06);
                    --info-border: rgba(255, 108, 0, 0.15);
                }
            }
            body {
                margin: 0;
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
                background:
                    radial-gradient(
                        800px 400px at 50% 0%,
                        rgba(255, 108, 0, 0.12),
                        transparent 60%
                    ),
                    var(--bg);
                color: var(--fg);
                display: grid;
                place-items: center;
                min-height: 100vh;
            }
            .wrap {
                text-align: center;
                padding: 32px;
                max-width: 500px;
            }
            .logo {
                width: 140px;
                height: auto;
                margin-bottom: 16px;
                filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35));
            }
            h1 {
                font-size: 48px;
                margin: 0 0 12px;
                color: var(--accent);
            }
            h3 {
                color: var(--muted);
                font-weight: normal;
                margin: 0 0 24px;
            }
            .info {
                background: var(--info-bg);
                border: 1px solid var(--info-border);
                border-radius: 8px;
                padding: 1em 1.5em;
                margin: 1em 0;
                text-align: left;
            }
            .info dl {
                margin: 0;
            }
            .info dt {
                color: var(--muted);
                font-size: 0.8em;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-top: 0.6em;
            }
            .info dt:first-child {
                margin-top: 0;
            }
            .info dd {
                margin: 0.15em 0 0 0;
                font-weight: 600;
                font-size: 0.95em;
            }
            p {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 0.85em;
            }
            .dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent);
                margin-right: 6px;
                animation: pulse 1.5s ease-in-out infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }
        </style>
    </head>

            <h1>503</h1>
            <h3>The backend is offline</h3>
            <div class="info" id="info">
                <dl>
                    <dt>Backend</dt>
                    <dd id="backend-id">@@BACKEND_ID@@</dd>
                    <dt>Status</dt>
                    <dd id="status"><span class="dot"></span>@@STATUS@@</dd>
                    <dt>Host</dt>
                    <dd id="host">@@HOST@@</dd>
                </dl>
            </div>
            <p><span class="dot"></span>Waiting for backend to come online&hellip;</p>
        </div>
        <script>
            (function() {
                var es;
                function connect() {
                    es = new EventSource("/__odd-box-sse");
                    es.addEventListener("status", function(e) {
                        try {
                            var d = JSON.parse(e.data);
                            var statusEl = document.getElementById("status");
                            if (statusEl) statusEl.innerHTML = '<span class="dot"></span>' + d.status;
                            if (d.backend_id) {
                                var bidEl = document.getElementById("backend-id");
                                if (bidEl) bidEl.textContent = d.backend_id;
                            }
                        } catch(ex) {}
                    });
                    es.addEventListener("reload", function() {
                        if (es) es.close();
                        setTimeout(()=>{
                          location.reload();
                        }, 2000);
                    });
                    es.onerror = function() {
                        es.close();
                        setTimeout(()=>{
                          location.reload();
                        }, 2000);
                    };
                }

                if('@@STATUS@@'==='Running') {
                  setTimeout(()=>{
                    location.reload();
                  }, 2000);
                } else {
                  connect();
                }
            })();
        </script>
    </body>
