version: V4
log_level: Trace
port_range_start: 6666
ip: 0.0.0.0

env:
  kale: erik

root_dir: "~"
default_log_format: standard
auto_start: true
cruma: anon
admin_api_host: null
admin_api_password: null

backends:

  BE5:
    type: remote

    endpoints:

      - addr: lobste.rs
        port: 443

    protocol: h1
    https: true
    keep_original_host_header: false

  BE1:
    type: static
    dir: $cfg_dir/docs/book
    index: index.html
    list_dir: true
    render_markdown: true
    cache_max_age: null
    spa_fallback: false

  BE6:
    type: process
    bin: python3

    args:
      - -m
      - http.server
      - $port

    dir: null
    env: {}
    protocol: h1
    https: false
    port: null
    auto_start: false
    exclude_from_start_all: false
    log_level: null
    log_format: null

  BE2:
    type: static
    dir: $cfg_dir/temp
    index: index.html
    list_dir: true
    render_markdown: true
    cache_max_age: 3600
    spa_fallback: false

  hello-world:
    type: static
    dir: "~"
    index: index.html
    list_dir: true
    render_markdown: false
    cache_max_age: null
    spa_fallback: false

frontends:

  http:
    port: 80

    routes:
      B.localhost: BE1
      C.localhost: BE2
      py.localtest.me: BE4

      images1.local:
        backend: BE2
        capture_subdomains: false
        forward_subdomains: false
        redirect_to_https: true
        lets_encrypt: false

      test2.localhost: BE1
      A.localtest.me: BE1
      B2.localhost: BE1
      test.localhost: hello-world
      nginx.localhost: BE4
      lobsters.localtest.me: BE3
      hello-hi: BE2
      C3.localhost: BE2
      odd-box-docs.localhost: BE2
      A1.localtest.me: BE6

  https:
    port: 443
    cert: self_signed
    routes: inherit
