# Migrated from odd-box V3 TOML config
# Review this file carefully before using it.

tunnel_id: ANON
tunnel_secret: ANON
listeners:
- port: 80
  addr: all
  kind: http
- port: 443
  addr: all
  kind: https
backends:
- id: images-localhost
  kind: https
  destination: images.dev.bookvisit.com:443
processes:
- id: images-local
  command: dotnet
  args:
  - EasyAccessHotels.Images.dll
  working_directory: $root_dir/EasyAccessHotels.Images/publish
  auto_start: false
  env:
    bv_telemetry_server: https://jaeger-collector.bv.k8s.dev.visitgroup.com:443/
    bv_sigr_server: //signalr.local
    ext-svc-url: http://externalservices.local:80
    fd-api-url: fdapi.local:80
- id: admin-local
