version: V4
log_level: Trace
port_range_start: 6666
ip: 0.0.0.0

env:
  kale: erik

root_dir: "~"
default_log_format: standard
auto_start: true

cruma:
  id: 3e77aa0b-9767-4979-bb09-e2e8fe199480
  key: aca26f80ef234e13b81ee69ef13878e2

admin_api_host: null
admin_api_password: null

backends:

  omni:
    type: remote

    endpoints:

      - addr: omni.se
        port: 443

    protocol: h1
    https: true
    keep_original_host_header: false

frontends:

  http:
    port: 80

    routes:

      omni:
        backend: omni
        forward_subdomains: false
        redirect_to_https: false
        lets_encrypt: false
        enable_cruma: true

  https:
    port: 443
    cert: self_signed
    routes: inherit
