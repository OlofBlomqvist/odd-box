version: V4
log_level: Trace
port_range_start: 6666
ip: 0.0.0.0
env: {}
root_dir: "~"
default_log_format: standard
auto_start: true
admin_api_host: null
admin_api_password: null

backends:

  BE2:
    type: static
    dir: $cfg_dir/temp
    index: index.html
    list_dir: true
    render_markdown: true
    cache_max_age: 3600

  BE3:
    type: process
    bin: podman

    args:
      - run
      - --replace
      - --quiet
      - -p$port:80
      - --name
      - odd-nginx
      - nginx

    dir: null
    env: {}
    protocol: h1
    https: false
    port: null
    auto_start: false
    exclude_from_start_all: false
    log_level: null
    log_format: null

  BE1:
    type: static
    dir: $cfg_dir/docs/book
    index: index.html
    list_dir: true
    render_markdown: true
    cache_max_age: null

  BE4:
    type: process
    bin: /nix/store/n9xlfadcp7avgi4w87w41k8vnnyi4hm8-user-environment/bin/caddy

    args:
      - run
      - --config
      - ./CaddyTest1
      - --adapter
      - caddyfile

    dir: .
    env: {}
    protocol: h2
    https: false
    port: 9999
    auto_start: false
    exclude_from_start_all: false
    log_level: null
    log_format: null

  BE6:
    type: process
    bin: python

    args:
      - -m
      - http.server
      - $port

    dir: null
    env: {}
    protocol: h1
    https: false
    port: null
    auto_start: false
    exclude_from_start_all: false
    log_level: null
    log_format: null

  BE5:
    type: remote

    endpoints:

      - addr: lobste.rs
        port: 443

    protocol: h1
    https: true
    keep_original_host_header: false

frontends:

  http:
    port: 80

    routes:
      py.localtest.me: BE4
      B.localhost: BE1
      lobsters.localtest.me: BE3
      B2.localhost: BE1
      C3.localhost: BE2
      odd-box-docs.localhost: BE2
      C.localhost: BE2
      hello-hi: BE2
      A.localtest.me: BE1

      images1.local:
        backend: BE2
        capture_subdomains: false
        forward_subdomains: false
        redirect_to_https: true
        lets_encrypt: false

      test2.localhost: BE1
      A1.localtest.me: BE6
      nginx.localhost: BE4

  https:
    port: 443
    cert: self_signed
    routes: inherit
