name: Build and Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git reference (branch or tag) to build from'
        required: true
      release_tag:
        description: 'GitHub release tag to upload artifacts to (must already exist)'
        required: true

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── Linux: static musl binaries via Dockerfile.build ────────────────
          # These use Docker so all GUI/crypto C dependencies are satisfied
          # without polluting the runner environment.
          - os: ubuntu-latest
            artifact_name: odd-box-x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
            build_method: docker

          - os: ubuntu-latest
            artifact_name: odd-box-aarch64-unknown-linux-musl
            target: aarch64-unknown-linux-musl
            build_method: docker_qemu   # docker + QEMU emulation

          # ── Windows ─────────────────────────────────────────────────────────
          - os: windows-latest
            artifact_name: odd-box-x86_64-pc-windows-msvc.exe
            target: x86_64-pc-windows-msvc
            build_method: cargo_windows

          # ── macOS arm64: .app bundle + DMG (distributed via Homebrew cask) ──
          # macos-latest is arm64 (Apple Silicon) — builds aarch64-apple-darwin.
          - os: macos-latest
            artifact_name: odd-box-aarch64-apple-darwin.dmg
            target: aarch64-apple-darwin
            build_method: macos_dmg

          # ── macOS x86_64: .app bundle + DMG (Intel Mac fallback) ───────────────
          # macos-13 is the last x86_64 GitHub-hosted runner.
          - os: macos-13
            artifact_name: odd-box-x86_64-apple-darwin.dmg
            target: x86_64-apple-darwin
            build_method: macos_dmg

    steps:
      - name: Checkout odd-box
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # cruma-sdk is a symlink on developer machines (points to an absolute
      # local path).  On CI we replace it with a real checkout so cargo can
      # resolve the path dependency.
      - name: Checkout cruma-sdk
        uses: actions/checkout@v4
        with:
          repository: umbra-yurei/cruma-sdk
          path: cruma-sdk
          token: ${{ secrets.CRUMA_SDK_TOKEN }}

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      # ── Linux: Docker-based build (handles GUI/crypto C deps) ───────────────
      - name: Set up QEMU (aarch64 Linux only)
        if: matrix.build_method == 'docker_qemu'
        uses: docker/setup-qemu-action@v3

      - name: Build Linux binary (Docker)
        if: startsWith(matrix.build_method, 'docker')
        run: |
          PLATFORM_ARG=""
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            PLATFORM_ARG="--platform linux/arm64"
          fi
          DOCKER_BUILDKIT=1 docker build \
            $PLATFORM_ARG \
            --file Dockerfile.build \
            --build-context "cruma-sdk=$(realpath cruma-sdk)" \
            --build-arg RUST_TARGET="${{ matrix.target }}" \
            --target export \
            --output "type=local,dest=_docker_out" \
            .
          mv _docker_out/odd-box "${{ matrix.artifact_name }}"

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Install NASM (Windows)
        if: matrix.build_method == 'cargo_windows'
        uses: ilammy/setup-nasm@v1

      - name: Build (Windows)
        if: matrix.build_method == 'cargo_windows'
        shell: pwsh
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --profile dist --target ${{ matrix.target }}
          Move-Item "target/${{ matrix.target }}/dist/odd-box.exe" "${{ matrix.artifact_name }}"

      - name: Verify Windows artifact
        if: matrix.build_method == 'cargo_windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.artifact_name }}")) {
            throw "expected artifact not found: ${{ matrix.artifact_name }}"
          }

      # ── macOS arm64 DMG ──────────────────────────────────────────────────────
      - name: Install cargo-bundle
        if: matrix.build_method == 'macos_dmg'
        run: cargo install cargo-bundle

      - name: Install create-dmg
        if: matrix.build_method == 'macos_dmg'
        run: brew install create-dmg

      - name: Build macOS app bundle + DMG
        if: matrix.build_method == 'macos_dmg'
        run: DMG_OUT="${{ matrix.artifact_name }}" bash pack-osx.sh

      # ── Upload ───────────────────────────────────────────────────────────────
      - name: Upload release artifact
        run: gh release upload "${{ github.event.inputs.release_tag }}" "${{ matrix.artifact_name }}"
